<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="omni-bg-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4f46e5" />
      <stop offset="50%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <linearGradient id="omni-inner-grad" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#818cf8" />
      <stop offset="50%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Capsule Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#0f172a" />
  <rect x="7" y="7" width="106" height="106" rx="27" stroke="url(#omni-bg-grad)" stroke-width="2" opacity="0.8" />
  
  <!-- Geometric Knowledge Network Facets -->
  <g filter="url(#glow)">
    <!-- Hexagonal Crystal Wireframe -->
    <path d="M60 18 L96 39 V81 L60 102 L24 81 V39 Z" stroke="url(#omni-inner-grad)" stroke-width="3" stroke-linejoin="round" />
    <path d="M60 18 V102" stroke="url(#omni-inner-grad)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
    <path d="M60 60 L96 39 M60 60 L24 39 M60 60 L60 102" stroke="url(#omni-inner-grad)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Central and Vertex Nodes -->
    <circle cx="60" cy="60" r="7" fill="#38bdf8" />
    <circle cx="60" cy="18" r="5" fill="#34d399" />
    <circle cx="96" cy="39" r="5" fill="#818cf8" />
    <circle cx="24" cy="39" r="5" fill="#818cf8" />
    <circle cx="96" cy="81" r="5" fill="#34d399" />
    <circle cx="24" cy="81" r="5" fill="#34d399" />
    <circle cx="60" cy="102" r="5" fill="#38bdf8" />
  </g>
</svg>
